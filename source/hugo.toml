baseURL = 'https://extremal.combinatoria.org/'
publishDir = 'public'
languageCode = 'pt-br'
defaultContentLanguage = 'pt'
defaultContentLanguageInSubdir = false
title = 'Combinatória Extremal no Brasil'
theme = 'PaperMod'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  author = "Combinatória Extremal no Brasil"
  defaultTheme = 'auto'
  displayFullLangName = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = true
  UseHugoToc = true

  [params.profileMode]
    enabled = true
    title = "Combinatória Extremal no Brasil"

    imageUrl = ""
    imageTitle = "Combinatória Extremal"

# Reuse the existing site map for browser icons.
[params.assets]
  favicon = 'images/brazil_map.png'
  favicon16x16 = 'images/brazil_map.png'
  favicon32x32 = 'images/brazil_map.png'
  apple_touch_icon = 'images/brazil_map.png'
  safari_pinned_tab = 'images/brazil_map_vector.svg'

